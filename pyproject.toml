[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GraphaFold"
version = "0.1.0"
description = "A graph neural network for noncanonical RNA interaction prediction."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["RNA", "GNN", "bioinformatics", "noncanonical interactions", "RiNALMo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26,<2",
  "torch>=2.4,<2.6",
]

[project.optional-dependencies]
rinalmo = [
  "multimolecule==0.2.0",
  "transformers==5.9.0",
  "pandas==2.2.3",
]
plots = [
  "matplotlib>=3.8",
  "pandas>=2.2",
  "seaborn>=0.13",
]
dev = [
  "build>=1.2",
  "pytest>=8",
]

[project.scripts]
graphafold = "graphafold.cli:main"

[project.urls]
Documentation = "https://github.com/hlvdkv/GraphaFold#readme"
Repository = "https://github.com/hlvdkv/GraphaFold"
Issues = "https://github.com/hlvdkv/GraphaFold/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["graphafold*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
